<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NÜMA · ¿Qué aura eres hoy?</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceee6;--ink:#1f3a1a;--muted:#4b5f46;--card:rgba(255,255,255,.66);--line:rgba(31,58,26,.14);--c:#7bbf6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a14;--ink:#eaf2e0;--muted:#b4c4aa;--card:rgba(255,255,255,.08);--line:rgba(234,242,224,.18)}}
:root[data-theme="dark"]{--bg:#111a14;--ink:#eaf2e0;--muted:#b4c4aa;--card:rgba(255,255,255,.08);--line:rgba(234,242,224,.18)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:hidden}
.blob{position:fixed;width:56vmax;height:56vmax;max-width:520px;max-height:520px;border-radius:50%;filter:blur(60px);opacity:.5;z-index:0;animation:float 18s ease-in-out infinite alternate;pointer-events:none}
.b1{background:#f4929f;top:-18%;left:-22%}
.b2{background:#8fd0f0;top:30%;right:-30%;animation-delay:-6s}
.b3{background:#f7e36b;bottom:-20%;left:-10%;animation-delay:-11s}
.b4{background:#c4a0f5;bottom:5%;right:-18%;animation-delay:-3s;opacity:.35}
@keyframes float{to{transform:translate(30px,-40px) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}*{transition:none!important}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 20px 40px;min-height:100vh;display:flex;flex-direction:column}
.logo{font-weight:800;font-size:clamp(52px,16vw,84px);letter-spacing:-.02em;line-height:1;text-align:center;margin:8px 0 0}
.sub{text-align:center;color:var(--muted);font-size:18px;margin:10px auto 0;max-width:22ch;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;margin-top:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hidden{display:none!important}
.icons{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:6px 0 22px;color:var(--ink)}
.icons svg{width:38px;height:38px;opacity:.85}
h2{font-size:24px;line-height:1.2;margin:0 0 6px;font-weight:600}
p{line-height:1.5;margin:0 0 14px;color:var(--muted);font-size:17px}
.btn{font:inherit;font-weight:600;font-size:18px;border:0;border-radius:999px;padding:15px 28px;background:var(--ink);color:var(--bg);cursor:pointer;width:100%;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
button:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f4929f,#f7b267,#f7e36b,#9bd48a,#8fd0f0,#c4a0f5);transition:width .4s}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{font:inherit;font-size:17px;text-align:left;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px 16px;cursor:pointer;line-height:1.3;transition:transform .15s,border-color .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt.sel{background:var(--ink);color:var(--bg);transform:scale(.98)}
.count{font-size:15px;color:var(--muted);margin-bottom:4px}
.res{text-align:center}
.orb{width:210px;height:210px;margin:-6px auto 0;position:relative;display:grid;place-items:center}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(closest-side,var(--c) 25%,transparent 100%);filter:blur(10px);animation:pulse 4s ease-in-out infinite alternate}
.orb svg{position:relative;width:76px;height:76px;color:#1f3a1a}
@keyframes pulse{to{transform:scale(1.12)}}
.res h2{font-size:34px;font-weight:800;margin-top:4px}
.res p.d{color:var(--ink);font-size:18px}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0 22px}
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:92px;padding:12px 10px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:500;color:var(--ink)}
.chip svg{width:34px;height:34px}
.chip{border-color:var(--c)}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:auto;padding-top:26px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-yoga" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="9" r="4"/><path d="M24 14v16M24 19L14 10M24 19L34 10M24 30v13M24 30l10 4-8 4"/></g></symbol>
<symbol id="i-pilates" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="26" r="3.5"/><path d="M14 28l20 4M18 29l-2 10M34 32l8-10M34 32l10 4M4 42h40"/></g></symbol>
<symbol id="i-fn" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 24h24M12 15v18M7 19v10M36 15v18M41 19v10"/></g></symbol>
<symbol id="i-cycling" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="33" r="7"/><circle cx="37" cy="33" r="7"/><path d="M11 33h11l6-13 9 13M22 33l-4-13M15 20h7M28 20h5"/><circle cx="25" cy="10" r="3.5"/></g></symbol>
<symbol id="i-run" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="29" cy="9" r="3.8"/><path d="M26 15l-4 13M25 18l9 4M25 18l-9 2M22 28l9 6-2 9M22 28l-8 6-6-2"/></g></symbol>
<symbol id="i-box" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20c0-6 5-10 11-10h5c6 0 9 4 9 10v6c0 4-3 6-6 6H18v8h-6z"/><path d="M12 38h6M20 22h10"/></g></symbol>
<symbol id="i-swim" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="34" cy="14" r="3.5"/><path d="M8 26l14-8 8 4M22 18l-6-5M4 36q5-5 10 0t10 0 10 0 10 0M4 43q5-5 10 0t10 0 10 0 10 0"/></g></symbol>
<symbol id="i-dance" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="8" r="4"/><path d="M24 13v15M24 17L12 11M24 17l12 8M24 28l-8 14M24 28l10 12"/></g></symbol>
<symbol id="i-stretch" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="8" r="4"/><path d="M24 13v15M24 17L12 5M24 17L36 5M24 28l-8 15M24 28l8 15"/></g></symbol>
<symbol id="i-med" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="11" r="4"/><path d="M24 16v14M24 21l-10 11M24 21l10 11M10 38q14-12 28 0M10 38q14 7 28 0"/></g></symbol>
</defs>
</svg>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<main>
  <h1 class="logo">NÜMA</h1>
  <div class="sub">¿Qué energía eres hoy?</div>

  <section id="start" class="card">
    <div class="icons">
      <svg><use href="#i-yoga"/></svg><svg><use href="#i-run"/></svg><svg><use href="#i-cycling"/></svg><svg><use href="#i-fn"/></svg><svg><use href="#i-pilates"/></svg><svg><use href="#i-dance"/></svg>
    </div>
    <h2>Descubre tu aura del día</h2>
    <p>Responde 5 preguntas rápidas y te decimos qué color eres hoy y qué actividad NÜMA va con tu energía.</p>
    <button class="btn" id="go">Empezar</button>
  </section>

  <section id="quiz" class="card hidden" aria-live="polite">
    <div class="bar"><i id="prog"></i></div>
    <div class="count" id="count"></div>
    <h2 id="q"></h2>
    <div class="opts" id="opts"></div>
  </section>

  <section id="result" class="card res hidden" aria-live="polite">
    <div class="orb"><svg id="rico"><use href="#i-yoga"/></svg></div>
    <h2 id="rname"></h2>
    <p class="d" id="rtext"></p>
    <p>Tu actividad NÜMA</p>
    <div class="acts" id="racts"></div>
    <button class="btn" id="again">Volver a jugar</button>
  </section>

  <div class="foot">Muévete como te sientas hoy.</div>
</main>
<script>
var A={
roja:{n:'Aura Roja',c:'#e8606c',i:'box',t:'Eres fuerza, pasión y decisión. Cuando te propones algo, no hay quién te pare, y entrenas para superarte cada día.',a:[['box','Boxeo'],['fn','CrossFit'],['fn','Pesas']]},
naranja:{n:'Aura Naranja',c:'#f4a259',i:'dance',t:'Eres alegría y diversión. Haces que cualquier plan se vuelva fiesta y entrenas mejor cuando es en grupo.',a:[['dance','Baile'],['dance','Zumba'],['fn','Clases grupales']]},
amarilla:{n:'Aura Amarilla',c:'#f6dc4f',i:'run',t:'Eres optimismo y energía. Tu buena vibra se nota desde lejos y empiezas el día con ganas de todo.',a:[['cycling','Cycling'],['run','Running'],['run','Aire libre']]},
verde:{n:'Aura Verde',c:'#86c97a',i:'yoga',t:'Eres calma y bienestar. Cuidas tu cuerpo y tu mente con la misma atención, y eso se nota en cómo te sientes.',a:[['yoga','Yoga'],['pilates','Pilates'],['run','Caminatas']]},
azul:{n:'Aura Azul',c:'#74c3ec',i:'swim',t:'Eres tranquilidad y confianza. Entrenas con ritmo constante, sin afanes, y siempre mantienes la cabeza fría.',a:[['swim','Natación'],['pilates','Barre'],['stretch','Bajo impacto']]},
morada:{n:'Aura Morada',c:'#b78cf2',i:'med',t:'Eres intuición y creatividad. Te gusta sentir lo que haces, y el movimiento es tu forma de despejar la mente.',a:[['dance','Danza'],['med','Meditación en movimiento'],['yoga','Yoga']]},
rosada:{n:'Aura Rosada',c:'#f58fa8',i:'pilates',t:'Eres cariño y buena compañía. Entrenas para sentirte bien y disfrutas más cuando alguien te acompaña.',a:[['pilates','Pilates'],['pilates','Barre'],['dance','Clases con amigas']]},
blanca:{n:'Aura Blanca',c:'#e9ebe4',i:'stretch',t:'Eres claridad y nuevos comienzos. Entrenas para despejar la cabeza y empezar de cero cada vez que lo necesitas.',a:[['stretch','Estiramiento'],['med','Movilidad'],['med','Respiración']]}
};
var Q=[
{q:'¿Cómo amaneciste hoy?',o:[['Con toda la energía, listo/a para el día',{amarilla:2,roja:1}],['Tranquilo/a y sin afanes',{verde:2,azul:1}],['Con ganas de compañía y de hacer planes',{rosada:2,naranja:1}],['Necesito un reinicio para empezar de cero',{blanca:2,morada:1}]]},
{q:'¿Qué plan te late más hoy?',o:[['Un reto que me exija al máximo',{roja:2,amarilla:1}],['Una fiesta con música y amigos',{naranja:2,rosada:1}],['Un rato a solas para sentir y crear',{morada:2,blanca:1}],['Salir a respirar aire libre',{verde:2,amarilla:1}]]},
{q:'¿Qué música pondrías ahora mismo?',o:[['Algo potente que suba la adrenalina',{roja:2,naranja:1}],['Algo suave para ir a mi ritmo',{azul:2,verde:1}],['Algo bailable para moverme sin parar',{naranja:2,amarilla:1}],['Algo ambiental que me transporte',{morada:2,blanca:1}]]},
{q:'¿Con quién entrenas mejor?',o:[['Con mi mejor amigo/a al lado',{rosada:2,verde:1}],['Solo/a, a mi propio ritmo',{azul:2,roja:1}],['En un grupo grande y con buena vibra',{naranja:2,rosada:1}],['En silencio, con mi mente',{blanca:2,morada:1}]]},
{q:'¿Cómo quieres sentirte al terminar?',o:[['Invencible',{roja:2,amarilla:1}],['En paz y en equilibrio',{verde:2,azul:1}],['Inspirado/a y creativo/a',{morada:2,rosada:1}],['Ligero/a y renovado/a',{blanca:2,azul:1}]]}
];
var $=function(id){return document.getElementById(id)};
var step=0,score={};
function show(id){['start','quiz','result'].forEach(function(s){$(s).classList.toggle('hidden',s!==id)})}
function reset(){step=0;score={};Object.keys(A).forEach(function(k){score[k]=0})}
function render(){
  var d=Q[step];
  $('count').textContent='Pregunta '+(step+1)+' de '+Q.length;
  $('prog').style.width=(step/Q.length*100)+'%';
  $('q').textContent=d.q;
  var box=$('opts');box.innerHTML='';
  d.o.forEach(function(op){
    var b=document.createElement('button');
    b.className='opt';b.textContent=op[0];
    b.onclick=function(){
      b.classList.add('sel');
      for(var k in op[1])score[k]+=op[1][k];
      var all=box.querySelectorAll('button');for(var i=0;i<all.length;i++)all[i].disabled=true;
      setTimeout(function(){step++;step<Q.length?render():finish()},380);
    };
    box.appendChild(b);
  });
}
function finish(){
  var best=null,top=-1;
  Object.keys(score).forEach(function(k){
    var v=score[k]+Math.random()*0.9;
    if(v>top){top=v;best=k}
  });
  var a=A[best];
  document.documentElement.style.setProperty('--c',a.c);
  $('rname').textContent=a.n;
  $('rtext').textContent=a.t;
  $('rico').innerHTML='<use href="#i-'+a.i+'"/>';
  $('racts').innerHTML=a.a.map(function(x){return '<div class="chip"><svg><use href="#i-'+x[0]+'"/></svg>'+x[1]+'</div>'}).join('');
  show('result');window.scrollTo(0,0);
}
$('go').onclick=function(){reset();render();show('quiz')};
$('again').onclick=function(){document.documentElement.style.setProperty('--c','#7bbf6a');show('start')};
reset();
</script>
</body>
</html>
